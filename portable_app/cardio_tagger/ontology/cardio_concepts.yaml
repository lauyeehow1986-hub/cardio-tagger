version: "1.0.0"
default_section_targets:
  - "conclusion"
  - "impression"
  - "summary"
  - "recommendations"
  - "plan"

section_headers:
  conclusion:
    canonical_name: "CONCLUSION"
    priority: 1
    patterns:
      - '(?im)^\s*(?:[0-9]+[\.\)]\s*)?(?:FINAL\s+|CATHETERIZATION\s+|ANGIOGRAPHIC\s+|CLINICAL\s+|DISCHARGE\s+)?(?:CONCLUSIONS?|IMPRESSIONS?|SUMMARY\s+AND\s+PLAN|IMPRESSION\s*/\s*PLAN|CONCLUSION\s*AND\s*RECOMMENDATIONS?|SUMMARY|ASSESSMENT\s*(?:&|AND)\s*PLAN)\s*(?:[:\-—\n]|$)'
      - '(?im)^\s*(?:\[|\*\*)?(?:CONCLUSIONS?|IMPRESSIONS?|RECOMMENDATIONS?)(?:\]|\*\*)?\s*[:\-—]'
  stop_headers:
    patterns:
      - '(?im)^\s*(?:[0-9]+[\.\)]\s*)?(?:ELECTRONICALLY\s+SIGNED\s+BY|SIGNED\s+BY|ATTENDING\s+PHYSICIAN|DICTATED\s+BY|CC:|DISTRIBUTION:|ADDENDUM|BILLING\s+CODES|CPT\s+CODES|HEMODYNAMICS\s+TABLE|RADIATION\s+DOSE|CONTRAST\s+VOLUME|MEDICATIONS\s+ADMINISTERED|NURSING\s+NOTES)\b'

assertion_modifiers:
  negated:
    pre_window_tokens: 8
    post_window_tokens: 4
    patterns:
      - '\b(?:no\s+indication\s+for|no\s+plan\s+for|not\s+a\s+candidate\s+for|without\s+need\s+for|ruled\s+out|declined|refused|defer\s+indefinitely|no\s+further\s+pci|no\s+staged\s+pci|not\s+planned|avoid)\b'
  historical:
    pre_window_tokens: 6
    post_window_tokens: 4
    patterns:
      - '\b(?:history\s+of|prior|previous|s/p\s+prior|remote\s+history\s+of|in\s+20[0-2][0-9]|months\s+ago|years\s+ago)\b'
  conditional_or_hypothetical:
    pre_window_tokens: 8
    post_window_tokens: 6
    patterns:
      - '\b(?:if\s+ischemia|if\s+symptomatic|if\s+ffr\s+positive|consider\s+staged|possible\s+staged|pending\s+stress\s+test|pending\s+viability|should\s+symptoms\s+recur|versus\s+cabg)\b'
  performed_index:
    pre_window_tokens: 6
    post_window_tokens: 6
    patterns:
      - '\b(?:successful\s+staged\s+pci\s+performed\s+today|underwent\s+staged\s+pci\s+today|completion\s+of\s+staged\s+pci|staged\s+pci\s+to\s+[a-z0-9\s]+\s+completed)\b'
  planned_future:
    pre_window_tokens: 8
    post_window_tokens: 10
    patterns:
      - '\b(?:plan\s+for\s+staged|recommend\s+staged|scheduled\s+for\s+staged|return\s+for\s+staged|staged\s+pci\s+in\s+[0-9]+|staged\s+intervention\s+to|staged\s+revascularization\s+of|bring\s+back\s+for\s+pci|elective\s+staged\s+pci|stage\s+ii\s+pci|staged\s+pci\s+during\s+index\s+admission|staged\s+pci\s+at\s+a\s+later\s+date)\b'

concepts:
  staged_pci:
    id: "CARDIO_STAGED_PCI"
    display_name: "Staged Percutaneous Coronary Intervention (Staged PCI)"
    snomed_ct: "415070008"
    umls_cui: "C1532338"
    target_sections: ["conclusion", "impression", "plan", "recommendations", "summary"]
    allow_all_sections_fallback: true
    aho_corasick_seeds:
      - "staged pci"
      - "stage pci"
      - "staged percutaneous"
      - "staged intervention"
      - "staged revascularization"
      - "staged angioplasty"
      - "staged stenting"
      - "stage 2 pci"
      - "stage ii pci"
      - "second stage pci"
      - "two-stage pci"
      - "non-culprit pci"
      - "nonculprit pci"
      - "bring back for pci"
      - "return for pci"
      - "deferred pci to"
      - "relook angio"
      - "staged lad"
      - "staged rca"
      - "staged lcx"
      - "staged om"
      - "staged diag"
    regex_patterns:
      - '(?i)\b(?:staged?|two[\s\-]stage|second[\s\-]stage|stage\s+(?:2|ii))\s+(?:pci|percutaneous\s+coronary\s+intervention|coronary\s+intervention|revascularization|angioplasty|stenting|des)\b'
      - '(?i)\b(?:pci|revascularization|intervention|stenting)\s+(?:of|to)\s+(?:the\s+)?(?:non[\-\s]?culprit\s+)?(?:lad|rca|lcx|left\s+main|lmca|om[1-3]?|d[1-2]?|diagonal|ramus|pda|plv|[a-z]+\s+artery)\s+(?:as\s+a\s+staged\s+procedure|in\s+a\s+staged\s+fashion|at\s+a\s+later\s+stage|in\s+[1-8]\s+(?:days|weeks))\b'
      - '(?i)\b(?:bring\s+back|return|schedule\s+patient)\s+(?:in\s+[0-9]+\s+(?:days|weeks|months)\s+)?for\s+(?:staged\s+|elective\s+|completion\s+)?(?:pci|revascularization|intervention)\s+(?:of|to)\b'
    gliner_labels:
      - "staged percutaneous coronary intervention"
      - "planned future coronary stenting"
      - "non-culprit target vessel for staged PCI"
      - "timeframe for staged revascularization"
    subtypes:
      - "STAGED_PCI_PLANNED"
      - "STAGED_PCI_PERFORMED_INDEX"
      - "STAGED_PCI_CONDITIONAL"
      - "STAGED_PCI_HISTORICAL"
      - "STAGED_PCI_NEGATED"

  primary_or_culprit_pci:
    id: "CARDIO_CULPRIT_PCI"
    display_name: "Primary / Culprit Lesion PCI"
    snomed_ct: "415070008"
    target_sections: ["conclusion", "all"]
    aho_corasick_seeds:
      - "primary pci"
      - "culprit pci"
      - "pci to culprit"
      - "successful pci"
      - "des to lad"
      - "des to rca"
      - "des to lcx"
      - "drug eluting stent"
    regex_patterns:
      - '(?i)\b(?:primary|emergent|culprit(?:\s+lesion)?|successful|ad\s+hoc)\s+pci\b'
    gliner_labels:
      - "primary percutaneous coronary intervention"
      - "culprit coronary artery lesion"
      - "drug eluting stent implantation"

  cabg_evaluation:
    id: "CARDIO_CABG"
    display_name: "Coronary Artery Bypass Grafting (CABG) Referral or History"
    snomed_ct: "232717009"
    target_sections: ["conclusion", "all"]
    aho_corasick_seeds:
      - "cabg"
      - "coronary artery bypass"
      - "cardiothoracic surgery"
      - "surgical revascularization"
      - "heart team discussion"
    regex_patterns:
      - '(?i)\b(?:cabg|coronary\s+artery\s+bypass(?:\s+grafting)?|surgical\s+revascularization|cardiothoracic\s+surgical\s+consult)\b'
    gliner_labels:
